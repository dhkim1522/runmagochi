<!doctype html>

<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column">

  </div>
  <div style="display: flex; gap: 8px; padding: 0 16px 12px; overflow-x: auto">
    <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #1d1d1f; color: #ffffff; font-family: inherit; font-size: 13px">상의</button>

  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 16px">

  <div style="padding: 12px 16px">
    <button type="button" style="width: 100%; height: 52px; border-radius: 26px; border: none; background: #1f6f66; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700">120 코인으로 구매하고 장착</button>
  </div>
  <nav style="height: 64px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #e3e3e3; font-size: 12px">

    <a href="Activity.html" style="display: flex; align-items: center; justify-content: center; color: #555555; text-decoration: none">기록</a>
