<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>러닝 요약</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#1d1d1f}
a{color:#1f6f66}a:hover{color:#174f49}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e3e3e3">
    <span style="font-weight: 700">러닝 요약</span>
    <span style="font-size: 14px; color: #555555">공유</span>
  </div>
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; color: #555555">오늘 오후 5:51</span>
    <span style="font-size: 18px; font-weight: 600">금요일 저녁 러닝 ✎</span>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column">
    <span style="font-size: 72px; font-weight: 700; line-height: 1">5.02</span>
    <span style="font-size: 14px; color: #555555">킬로미터 · 목표 5km 달성</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 16px; padding: 20px 16px">
    <div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 700">6'25"</span><span style="font-size: 12px; color: #555555">평균 페이스</span></div>
    <div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 700">32:14</span><span style="font-size: 12px; color: #555555">시간</span></div>
    <div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 700">342</span><span style="font-size: 12px; color: #555555">칼로리</span></div>
  </div>
  <div style="margin: 0 16px; height: 140px; border: 1px dashed #9a9a9a; border-radius: 8px; background: #f4f4f4; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #555555">지도 · 페이스 구간별 색상 경로</div>
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-weight: 600">구간</span>
    <div style="display: grid; grid-template-columns: 60px minmax(0, 1fr) 56px; font-size: 13px; color: #555555"><span>km</span><span>페이스</span><span>고도</span></div>
    <div style="display: grid; grid-template-columns: 60px minmax(0, 1fr) 56px; align-items: center; font-size: 14px"><span>1</span><div style="height: 10px; width: 78%; background: #8a8a8a; border-radius: 2px"></div><span>3m</span></div>
    <div style="display: grid; grid-template-columns: 60px minmax(0, 1fr) 56px; align-items: center; font-size: 14px"><span>2</span><div style="height: 10px; width: 84%; background: #8a8a8a; border-radius: 2px"></div><span>5m</span></div>
    <div style="display: grid; grid-template-columns: 60px minmax(0, 1fr) 56px; align-items: center; font-size: 14px"><span>3</span><div style="height: 10px; width: 72%; background: #8a8a8a; border-radius: 2px"></div><span>2m</span></div>
  </div>
  <div style="flex: 1"></div>
  <div style="padding: 16px 16px 24px">
    <a href="Reward.html" style="height: 52px; border-radius: 26px; background: #1f6f66; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">보상 받기</a>
  </div>
</div>
</body>
</html>
