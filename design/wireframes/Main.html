<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 러닝 시작</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#1d1d1f}
a{color:#1f6f66}a:hover{color:#174f49}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e3e3e3">
    <span style="font-weight: 700; font-size: 18px">[앱 이름]</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="1" width="6" height="10" fill="#8a8a8a"/><rect x="1" y="3" width="10" height="6" fill="#8a8a8a"/><rect x="5" y="4" width="2" height="4" fill="#ffffff"/></svg>
      1,240
    </span>
  </div>
  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #555555">오늘 목표</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <span style="height: 40px; border-radius: 20px; border: 1px solid #bdbdbd; background: #ffffff; color: #1d1d1f; display: flex; align-items: center; justify-content: center; font-size: 15px; text-decoration: none">3km</span>
      <span style="height: 40px; border-radius: 20px; border: 2px solid #1f6f66; background: #e8f2f1; color: #1d1d1f; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">5km</span>
      <span style="height: 40px; border-radius: 20px; border: 1px solid #bdbdbd; background: #ffffff; color: #1d1d1f; display: flex; align-items: center; justify-content: center; font-size: 15px; text-decoration: none">10km</span>
      <a href="Goal.html" style="height: 40px; border-radius: 20px; border: 1px solid #bdbdbd; background: #ffffff; color: #1d1d1f; display: flex; align-items: center; justify-content: center; font-size: 15px; text-decoration: none">직접</a>
    </div>
    <div style="font-size: 12px; color: #555555">지난번 목표가 골라져 있다. 바꿀 때만 탭한다.</div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin: 16px; border: 1px dashed #9a9a9a; border-radius: 12px; background: #f4f4f4">
    <svg width="144" height="144" viewBox="0 0 12 12" shape-rendering="crispEdges" role="img" aria-label="도트 아바타"><rect x="4" y="1" width="4" height="4" fill="#555555"/><rect x="5" y="2" width="1" height="1" fill="#ffffff"/><rect x="7" y="2" width="1" height="1" fill="#ffffff"/><rect x="3" y="5" width="6" height="4" fill="#8a8a8a"/><rect x="2" y="6" width="1" height="2" fill="#555555"/><rect x="9" y="6" width="1" height="2" fill="#555555"/><rect x="4" y="9" width="1" height="3" fill="#555555"/><rect x="7" y="9" width="1" height="3" fill="#555555"/></svg>
    <div style="font-weight: 600">[아바타 이름] Lv.3</div>
    <div style="width: 200px; display: flex; flex-direction: column; gap: 4px">
      <div style="height: 6px; background: #e0e0e0; border-radius: 3px"><div style="width: 45%; height: 6px; background: #555555; border-radius: 3px"></div></div>
      <div style="font-size: 12px; color: #555555; text-align: center">다음 레벨까지 8.4km</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 16px">
    <a href="InRun.html" style="width: 132px; height: 132px; border-radius: 66px; background: #1f6f66; color: #ffffff; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">시작</a>
  </div>
  <nav style="height: 64px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #e3e3e3; font-size: 12px">
    <a href="Main.html" style="display: flex; align-items: center; justify-content: center; color: #1f6f66; font-weight: 700; text-decoration: none">러닝</a>
    <a href="Activity.html" style="display: flex; align-items: center; justify-content: center; color: #555555; text-decoration: none">기록</a>
    <a href="Avatar.html" style="display: flex; align-items: center; justify-content: center; color: #555555; text-decoration: none">아바타</a>
    <a href="Shop.html" style="display: flex; align-items: center; justify-content: center; color: #555555; text-decoration: none">상점</a>
  </nav>
</div>
</body>
</html>
