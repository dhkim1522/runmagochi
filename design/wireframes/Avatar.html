<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>아바타 레벨</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#1d1d1f}
a{color:#1f6f66}a:hover{color:#174f49}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column">
  <div style="height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e3e3e3; font-weight: 700">아바타</div>
  <div style="display: flex; gap: 16px; align-items: center; padding: 16px">
    <div style="width: 112px; height: 112px; border: 1px dashed #9a9a9a; border-radius: 12px; background: #f4f4f4; display: flex; align-items: center; justify-content: center">
      <svg width="88" height="88" viewBox="0 0 12 12" shape-rendering="crispEdges" role="img" aria-label="도트 아바타"><rect x="4" y="1" width="4" height="4" fill="#555555"/><rect x="5" y="2" width="1" height="1" fill="#ffffff"/><rect x="7" y="2" width="1" height="1" fill="#ffffff"/><rect x="3" y="5" width="6" height="4" fill="#8a8a8a"/><rect x="2" y="6" width="1" height="2" fill="#555555"/><rect x="9" y="6" width="1" height="2" fill="#555555"/><rect x="4" y="9" width="1" height="3" fill="#555555"/><rect x="7" y="9" width="1" height="3" fill="#555555"/></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 18px; font-weight: 700">[아바타 이름] Lv.4</span>
      <span style="font-size: 13px; color: #555555">누적 34.8km · 러닝 12회</span>
      <div style="height: 8px; background: #e6e6e6; border-radius: 4px"><div style="width: 70%; height: 8px; background: #1f6f66; border-radius: 4px"></div></div>
      <span style="font-size: 12px; color: #555555">다음 성장 단계까지 15.2km</span>
    </div>
  </div>
  <div style="padding: 0 16px 8px; display: flex; gap: 8px">
    <a href="Shop.html" style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #bdbdbd; color: #1d1d1f; display: flex; align-items: center; justify-content: center; font-size: 14px; text-decoration: none">옷장 · 꾸미기</a>
    <a href="Badges.html" style="flex: 1; height: 44px; border-radius: 22px; border: 1px solid #bdbdbd; color: #1d1d1f; display: flex; align-items: center; justify-content: center; font-size: 14px; text-decoration: none">업적</a>
  </div>
  <div style="padding: 16px 16px 8px; font-weight: 600">성장 단계</div>
  <div style="display: flex; flex-direction: column; padding: 0 16px; gap: 8px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: #e8f2f1; border: 2px solid #1f6f66"><div style="width: 44px; height: 44px; border: 1px dashed #9a9a9a; border-radius: 8px; background: #ffffff"></div><div style="display: flex; flex-direction: column"><span style="font-weight: 600">1단계 [알/새싹]</span><span style="font-size: 12px; color: #555555">0~50km · 현재</span></div></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid #e3e3e3; color: #8a8a8a"><div style="width: 44px; height: 44px; border: 1px dashed #c4c4c4; border-radius: 8px; background: #f4f4f4"></div><div style="display: flex; flex-direction: column"><span style="font-weight: 600">2단계 [어린 러너]</span><span style="font-size: 12px">50~250km · 잠김</span></div></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid #e3e3e3; color: #8a8a8a"><div style="width: 44px; height: 44px; border: 1px dashed #c4c4c4; border-radius: 8px; background: #f4f4f4"></div><div style="display: flex; flex-direction: column"><span style="font-weight: 600">3단계 [러너]</span><span style="font-size: 12px">250~1,000km · 잠김</span></div></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid #e3e3e3; color: #8a8a8a"><div style="width: 44px; height: 44px; border: 1px dashed #c4c4c4; border-radius: 8px; background: #f4f4f4"></div><div style="display: flex; flex-direction: column"><span style="font-weight: 600">4단계 [마라토너]</span><span style="font-size: 12px">1,000km 이상 · 잠김</span></div></div>
  </div>
  <div style="flex: 1"></div>
  <nav style="height: 64px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #e3e3e3; font-size: 12px">
    <a href="Main.html" style="display: flex; align-items: center; justify-content: center; color: #555555; text-decoration: none">러닝</a>
    <a href="Activity.html" style="display: flex; align-items: center; justify-content: center; color: #555555; text-decoration: none">기록</a>
    <a href="Avatar.html" style="display: flex; align-items: center; justify-content: center; color: #1f6f66; font-weight: 700; text-decoration: none">아바타</a>
    <a href="Shop.html" style="display: flex; align-items: center; justify-content: center; color: #555555; text-decoration: none">상점</a>
  </nav>
</div>
</body>
</html>
