<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>러닝 중</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#1d1d1f}
a{color:#1f6f66}a:hover{color:#174f49}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #e8f2f1; display: flex; flex-direction: column; padding: 24px 20px">
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center">
    <div style="display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 700">6'12"</span><span style="font-size: 12px; color: #555555">현재 페이스</span></div>
    <div style="display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 700">6'25"</span><span style="font-size: 12px; color: #555555">평균 페이스</span></div>
    <div style="display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 700">18:42</span><span style="font-size: 12px; color: #555555">시간</span></div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
    <div style="font-size: 104px; font-weight: 700; line-height: 1; letter-spacing: -2px">2.91</div>
    <div style="font-size: 16px; color: #555555">킬로미터</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 16px">
    <div style="position: relative; height: 72px; border-bottom: 2px solid #1d1d1f">
      <svg width="64" height="64" viewBox="0 0 12 12" shape-rendering="crispEdges" role="img" aria-label="달리는 도트 아바타" style="position: absolute; left: 50%; bottom: 0"><rect x="4" y="1" width="4" height="4" fill="#555555"/><rect x="5" y="2" width="1" height="1" fill="#ffffff"/><rect x="7" y="2" width="1" height="1" fill="#ffffff"/><rect x="3" y="5" width="6" height="4" fill="#8a8a8a"/><rect x="9" y="5" width="2" height="1" fill="#555555"/><rect x="1" y="7" width="2" height="1" fill="#555555"/><rect x="3" y="9" width="2" height="2" fill="#555555"/><rect x="7" y="9" width="2" height="1" fill="#555555"/><rect x="8" y="10" width="1" height="2" fill="#555555"/></svg>
      <div style="position: absolute; right: 0; bottom: 6px; font-size: 12px; color: #555555">목표 5km</div>
    </div>
    <div style="font-size: 12px; color: #555555">아바타가 목표 진행률만큼 앞으로 달린다</div>
  </div>
  <div style="display: flex; justify-content: center; padding: 8px 0 16px">
    <a href="Paused.html" aria-label="일시정지" style="width: 96px; height: 96px; border-radius: 48px; background: #1d1d1f; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" fill="#ffffff"/><rect x="14" y="4" width="5" height="16" fill="#ffffff"/></svg>
    </a>
  </div>
  <div style="display: flex; justify-content: center; gap: 8px; font-size: 12px; color: #555555">
    <span>컨트롤</span><span style="font-weight: 700; color: #1d1d1f">●</span><span>구간 기록</span>
  </div>
</div>
</body>
</html>
