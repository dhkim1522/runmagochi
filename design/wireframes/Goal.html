<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목표 선택</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#1d1d1f}
a{color:#1f6f66}a:hover{color:#174f49}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8f8f8f; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="background: #ffffff; border-radius: 20px 20px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #cccccc; align-self: center"></div>
    <div style="font-size: 20px; font-weight: 700">오늘의 목표</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 48px; border-radius: 8px; border: 2px solid #1f6f66; background: #e8f2f1; font-family: inherit; font-size: 15px; font-weight: 600">거리</button>
      <button type="button" style="height: 48px; border-radius: 8px; border: 1px solid #bdbdbd; background: #ffffff; font-family: inherit; font-size: 15px">시간</button>
      <button type="button" style="height: 48px; border-radius: 8px; border: 1px solid #bdbdbd; background: #ffffff; font-family: inherit; font-size: 15px">자유</button>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0">
      <div style="font-size: 64px; font-weight: 700; line-height: 1">5.00</div>
      <div style="font-size: 14px; color: #555555">킬로미터</div>
      <div style="font-size: 12px; color: #555555">숫자를 눌러 직접 입력, 좌우로 밀어 0.5km 단위 조절</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px dashed #9a9a9a; border-radius: 8px; background: #f4f4f4; font-size: 13px">
      <svg width="20" height="20" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="1" width="6" height="10" fill="#8a8a8a"/><rect x="1" y="3" width="10" height="6" fill="#8a8a8a"/><rect x="5" y="4" width="2" height="4" fill="#ffffff"/></svg>
      <span>목표 달성 시 코인 +[N]개, 경험치 +[N]</span>
    </div>
    <a href="InRun.html" style="height: 52px; border-radius: 26px; background: #1f6f66; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">이 목표로 시작</a>
  </div>
</div>
</body>
</html>
