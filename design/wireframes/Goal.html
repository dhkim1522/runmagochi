<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목표 직접 입력</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#1d1d1f}
a{color:#1f6f66}a:hover{color:#174f49}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8f8f8f; display: flex; flex-direction: column; justify-content: center; padding: 0 28px">
  <div style="background: #ffffff; border-radius: 20px; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 20px; font-weight: 700">오늘 목표</div>
    <div style="display: flex; align-items: baseline; gap: 8px; padding: 8px 0; border-bottom: 2px solid #1f6f66">
      <span style="flex: 1; font-size: 40px; font-weight: 700; line-height: 1">7</span>
      <span style="font-size: 16px; color: #555555">km</span>
    </div>
    <div style="font-size: 12px; color: #555555">3~42km 사이 정수로 입력해 주세요</div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px dashed #9a9a9a; border-radius: 8px; background: #f4f4f4; font-size: 13px">
      <svg width="20" height="20" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="1" width="6" height="10" fill="#8a8a8a"/><rect x="1" y="3" width="10" height="6" fill="#8a8a8a"/><rect x="5" y="4" width="2" height="4" fill="#ffffff"/></svg>
      <span>달린 만큼 경험치, 목표를 채우면 보너스 경험치 +35</span>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <a href="Main.html" style="height: 44px; padding: 0 20px; border-radius: 22px; color: #1d1d1f; display: flex; align-items: center; text-decoration: none">취소</a>
      <a href="Main.html" style="height: 44px; padding: 0 20px; border-radius: 22px; background: #1f6f66; color: #ffffff; display: flex; align-items: center; font-weight: 700; text-decoration: none">저장</a>
    </div>
  </div>
  <div style="margin-top: 16px; font-size: 12px; color: #ffffff; text-align: center">홈의 "직접" 칩을 누르면 뜬다. 저장하면 칩에 7km 가 보인다.</div>
</div>
</body>
</html>
