<!-- @dsCard group="Actions" height=200 subtitle="높이 60 알약, 경계선 없이 옅은 그림자" -->
<style>
:root{--float:0 3px 8px -3px rgba(22,32,15,.14),0 1px 2px rgba(22,32,15,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--float:0 2px 4px -1px rgba(0,0,0,.2)}}
:root[data-theme="dark"]{--float:0 2px 4px -1px rgba(0,0,0,.2)}
body{margin:0;background:var(--background);color:var(--ink);font-family:var(--font-sans,"Pretendard",system-ui,sans-serif)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:20px}
.cap{font-size:13px;line-height:18px;font-weight:600;color:var(--ink-muted)}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.btn{height:60px;min-width:160px;padding:0 28px;border-radius:30px;font:700 22px/28px var(--font-sans,"Pretendard",sans-serif);cursor:pointer}
.primary{background:var(--primary);color:var(--on-primary);border:0;box-shadow:var(--float)}
.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--float)}
.panel{background:var(--panel);color:var(--on-panel);border:0}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:3px solid var(--primary-deep);outline-offset:3px}
</style>
<div class="row">
  <div class="col"><button class="btn primary">시작</button><span class="cap">주요 · primary + elevation-float</span></div>
  <div class="col"><button class="btn secondary">끝부분 잘라내기</button><span class="cap">보조 · surface + float + line 1px</span></div>
  <div class="col"><button class="btn panel">일시정지</button><span class="cap">어두운 판 · panel</span></div>
  <div class="col"><button class="btn primary" disabled>확인</button><span class="cap">비활성 · 50%</span></div>
</div>
