<!-- @dsCard group="Mascot" height=380 subtitle="하늘·땅 두 겹, 발 8px 묻힘" -->
<style>
body{margin:0;background:var(--background);color:var(--ink);font-family:var(--font-sans,"Pretendard",system-ui,sans-serif)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;padding:20px}
.cap{font-size:13px;line-height:18px;font-weight:600;color:var(--ink-muted)}
.stage{position:relative;width:350px;max-width:100%;height:320px;border-radius:24px;overflow:hidden;background:var(--stage-sky);display:flex;align-items:flex-end;justify-content:center}
.ground{position:absolute;left:0;right:0;bottom:0;height:56px;box-sizing:border-box;background:var(--stage-ground);border-top:4px solid var(--stage-ground-line)}
.pet{position:relative;width:256px;height:256px;margin-bottom:32px;image-rendering:pixelated}
.bubble{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;align-items:flex-start}
.bubble p{margin:0;background:var(--surface);border-radius:20px;padding:10px 16px;font-size:14px;line-height:20px;font-weight:700}
.bubble i{width:14px;height:14px;margin:-8px 0 0 28px;background:var(--surface);transform:rotate(45deg);border-radius:0 0 4px 0}
.layers{display:flex;flex-direction:column;gap:6px}
.sw{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--ink-muted)}
.sw b{width:28px;height:20px;border-radius:6px;display:block}
</style>

  </div>
  <div class="layers">
    <div class="sw"><b style="background:var(--stage-sky)"></b>stage-sky · 하늘 겹</div>
    <div class="sw"><b style="background:var(--stage-ground)"></b>stage-ground · 땅 겹</div>
