<!-- @dsCard group="Selection" height=220 subtitle="선택 표시는 하나: 연두 면 + 경계선" -->
<style>
body{margin:0;background:var(--background);color:var(--ink);font-family:var(--font-sans,"Pretendard",system-ui,sans-serif)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:20px}
.cap{font-size:13px;line-height:18px;font-weight:600;color:var(--ink-muted)}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.card{background:var(--surface);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;max-width:350px}
.lab{font-size:14px;line-height:20px;font-weight:700;color:var(--ink-muted)}
.seg,.chips{display:grid;gap:8px}
.seg{grid-template-columns:1fr 1fr}.chips{grid-template-columns:repeat(4,1fr)}
.chip{height:48px;border-radius:999px;border:2px solid transparent;background:var(--surface-soft);color:var(--ink);font:700 17px/24px var(--font-sans,"Pretendard",sans-serif);letter-spacing:-.02em;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary-edge);font-weight:800}
</style>
<div class="row">
  <section class="card">
    <div class="lab">오늘 목표</div>
    <div class="seg" role="group" aria-label="목표 종류"><button class="chip" aria-pressed="true">거리</button><button class="chip" aria-pressed="false">시간</button></div>
    <div class="chips"><button class="chip" aria-pressed="false">3km</button><button class="chip" aria-pressed="true">5km</button><button class="chip" aria-pressed="false">10km</button><button class="chip" aria-pressed="false">직접</button></div>
  </section>
</div>
